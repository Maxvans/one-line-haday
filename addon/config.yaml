name: One Line HaDay
version: "0.3.0"
slug: one_line_haday
description: One line a day journaling add-on for Home Assistant
url: https://github.com/Maxvans/one-line-haday
startup: services
boot: auto
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
ingress: true
ingress_port: 8099
panel_icon: mdi:calendar-text
panel_title: One Line HaDay
map:
  - addon_config:rw
  - data:rw
options:
  log_level: info
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
